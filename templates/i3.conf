# Generated by `dotfiles apply` from dotfiles.conf (template: templates/i3.conf).
# Do not edit: changes are overwritten. Included by ~/.config/i3/config.
# (i3 does not pass variables from included files back to the parent, so everything
# that uses these values lives here.)

font pango:{{font}} {{font_size_window}}

# Tiled windows have no border (main config); floating windows get a thin frame
default_floating_border pixel {{border_width}}
gaps inner {{gaps}}

#                       border       background text      indicator    child_border
client.focused          {{accent}}  {{bg}}    {{fg}}    {{accent}}  {{accent}}
client.focused_inactive {{overlay}}  {{bg}}    {{subtle}}  {{overlay}}  {{overlay}}
client.unfocused        {{overlay}}  {{bg}}    {{subtle}}  {{overlay}}  {{overlay}}
client.urgent           {{orange}}  {{orange}}  {{bg}}    {{orange}}  {{orange}}
client.placeholder      {{bg}}  {{bg}}    {{fg}}    {{bg}}  {{bg}}
client.background       {{bg}}

exec_always --no-startup-id feh --no-fehbg --bg-fill {{wallpaper_sh}}

# Idle: screensaver after {{screensaver_after}} s, lock {{lock_cycle}} s later (0 = never),
# display off after {{display_off_after}} s (0 = never). xss-lock itself starts in the main config.
exec --no-startup-id sh -c 'xset s noblank; xset s {{screensaver_after}} {{lock_cycle}}; xset dpms 0 0 {{display_off_after}}'
