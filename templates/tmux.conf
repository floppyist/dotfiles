# Generated by `dotfiles apply` from dotfiles.conf (template: templates/tmux.conf).
# Do not edit: changes are overwritten. Sourced at the end of ~/.config/tmux/tmux.conf.
#
#  1 nvim  2 bash  3 htop                          PREFIX  󰆍 main · crackbook   14:05
#  └ windows like the polybar workspaces           └ modes   └ capsule              └ accent block

set -g status-style "bg={{bg}},fg={{fg}}"
set -g status-justify left
set -g status-left ""
set -g status-left-length 0
set -g status-right-length 120

# Windows: the current one is the accent block, the others muted (bell: red, activity: yellow)
set -g window-status-separator ""
set -g window-status-format "#{?window_bell_flag,#[fg={{red_hi}}],#{?window_activity_flag,#[fg={{yellow_hi}}],#[fg={{muted}}]}} #I #W#{?window_zoomed_flag, 󰊓,} "
set -g window-status-current-format "#[bg={{accent}},fg={{on_accent}},bold] #I #W#{?window_zoomed_flag, 󰊓,} #[default]"

# Right: mode badges (only while active), session capsule, clock block
set -g status-right "#{?client_prefix,#[bg={{yellow_hi}}#,fg={{bg}}#,bold] 󰌌 prefix #[default] ,}#{?pane_in_mode,#[bg={{blue_hi}}#,fg={{bg}}#,bold] 󰆏 copy #[default] ,}#[bg={{surface}},fg={{subtle}}] 󰆍 #[fg={{fg}}]#S #[fg={{muted}}]· #[fg={{fg}}]#h #[default] #[bg={{accent}},fg={{on_accent}},bold] %H:%M #[default]"
set -g status-interval 15

set -g pane-border-style "fg={{overlay}}"
set -g pane-active-border-style "fg={{accent}}"
set -g display-panes-colour "{{muted}}"
set -g display-panes-active-colour "{{accent}}"

set -g message-style "bg={{surface}},fg={{fg}}"
set -g message-command-style "bg={{surface}},fg={{yellow_hi}}"
set -g mode-style "bg={{overlay}},fg={{fg}}"
set -g copy-mode-match-style "bg={{yellow}},fg={{bg}}"
set -g copy-mode-current-match-style "bg={{accent_text}},fg={{on_accent}}"
set -g clock-mode-colour "{{accent}}"

set -g menu-style "bg={{bg}},fg={{fg}}"
set -g menu-selected-style "bg={{surface}},fg={{fg}},bold"
set -g menu-border-style "fg={{overlay}}"
set -g menu-border-lines single
set -g popup-style "bg={{bg}},fg={{fg}}"
set -g popup-border-style "fg={{overlay}}"
set -g popup-border-lines single
