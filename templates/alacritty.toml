# Generated by `dotfiles apply` from dotfiles.conf (template: templates/alacritty.toml).
# Do not edit: changes are overwritten. Imported by ~/.config/alacritty/alacritty.toml
# (keys set there win, so it must not repeat these).

[window]
opacity = {{terminal_opacity}}
padding = { x = {{terminal_padding_x}}, y = {{terminal_padding_y}} }

[font]
normal = { family = "{{font}}", style = "Regular" }
bold = { family = "{{font}}", style = "Bold" }
italic = { family = "{{font}}", style = "Italic" }
bold_italic = { family = "{{font}}", style = "Bold Italic" }
size = {{font_size_terminal}}

[colors.primary]
background = "{{bg}}"
foreground = "{{fg}}"
dim_foreground = "{{subtle}}"
bright_foreground = "{{bright}}"

[colors.cursor]
text = "{{on_accent}}"
cursor = "{{accent}}"

[colors.vi_mode_cursor]
text = "{{bg}}"
cursor = "{{yellow_hi}}"

[colors.selection]
text = "CellForeground"
background = "{{overlay}}"

[colors.search.matches]
foreground = "{{bg}}"
background = "{{yellow}}"

[colors.search.focused_match]
foreground = "{{on_accent}}"
background = "{{accent_text}}"

[colors.footer_bar]
foreground = "{{fg}}"
background = "{{surface}}"

# ANSI palette: gruvbox. neomutt, mpvim and tmux use these 16 colors.
[colors.normal]
black = "{{black}}"
red = "{{red}}"
green = "{{green}}"
yellow = "{{yellow}}"
blue = "{{blue}}"
magenta = "{{purple}}"
cyan = "{{aqua}}"
white = "{{subtle}}"

[colors.bright]
black = "{{gray}}"
red = "{{red_hi}}"
green = "{{green_hi}}"
yellow = "{{yellow_hi}}"
blue = "{{blue_hi}}"
magenta = "{{purple_hi}}"
cyan = "{{aqua_hi}}"
white = "{{fg}}"
