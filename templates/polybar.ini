; Generated by `dotfiles apply` from dotfiles.conf (template: templates/polybar.ini).
; Do not edit: changes are overwritten. Included by ~/.config/polybar/config.ini.

[colors]
bg        = {{bg}}
surface   = {{surface}}
overlay   = {{overlay}}
fg        = {{fg}}
subtle    = {{subtle}}
muted     = {{muted}}
accent    = {{accent}}
accent-text = {{accent_text}}
on-accent = {{on_accent}}
red       = {{red}}
red-hi    = {{red_hi}}
green-hi  = {{green_hi}}
yellow-hi = {{yellow_hi}}
blue-hi   = {{blue_hi}}
purple-hi = {{purple_hi}}
aqua-hi   = {{aqua_hi}}
orange    = {{orange}}
orange-hi = {{orange_hi}}

[dotfiles]
; scale {{scale}}: fonts follow dpi, px values are scaled here
dpi = {{dpi}}
height = {{bar_height_px}}
tray-spacing = {{tray_spacing_px}}px
font-0 = "{{font}}:size={{font_size_bar}};{{bar_font_offset}}"
font-1 = "{{font}}:size={{font_size_bar_small}};{{bar_font_offset_small}}"
; the right half without hidden capsules and missing hardware (bar_hide, temperature_sensor,
; backlight); the full order is BAR_RIGHT in scripts/dotfiles
modules-right = {{bar_modules_right}}
; CPU temperature ({{temperature_sensor}})
temp-path = {{temperature_path}}
