# Generated by `dotfiles apply` from dotfiles.conf (template: templates/dunst.conf).
# Do not edit: changes are overwritten. Linked into ~/.config/dunst/dunstrc.d/ (dunst
# reads it after dunstrc, so these values win).

[global]
    # Sizes at scale 1: dunst scales them (and the offset) by Xft.dpi / 96 (scale = 0, auto)
    font = {{font}} {{font_size_notify}}
    # 12 px from the right edge and 12 px below the bar
    offset = (12, {{notify_offset_y}})
    frame_width = {{border_width}}
    frame_color = "{{blue}}"
    foreground = "{{fg}}"
    background = "{{bg}}"
    # progress bar (volume / brightness OSD)
    highlight = "{{accent}}"
    format = "<span size='small' foreground='{{muted}}'>󰂜  %a</span>\n<b>%s</b>\n%b"

[urgency_low]
    background = "{{bg}}"
    foreground = "{{subtle}}"
    frame_color = "{{overlay}}"

[urgency_normal]
    background = "{{bg}}"
    foreground = "{{fg}}"
    frame_color = "{{blue}}"

[urgency_critical]
    background = "{{bg}}"
    foreground = "{{fg}}"
    frame_color = "{{red}}"

# Volume / brightness / mic: compact, replaces itself, not kept in the history
[app_osd]
    appname = osd
    format = "<b>%s</b>"
    frame_color = "{{overlay}}"
    foreground = "{{fg}}"
    timeout = 1500ms
    history_ignore = yes
