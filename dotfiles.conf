# dotfiles.conf  ·  central settings for the whole desktop: the DEFAULTS
#
# Do not edit this file for your own machine. Put the keys you want different into
# ~/.config/dotfiles.conf (`dotfiles edit` creates and opens it, `dotfiles set KEY VALUE`
# changes one): it is read after this one and wins. This file documents every key.
#
# After editing, run:   dotfiles apply
#   generates ~/.config/dotfiles/* from templates/ and reloads i3, polybar, dunst and tmux.
#   Alacritty and rofi pick the change up by themselves; Neovim, Firefox and open shells
#   on their next start.
#
# Format: key = value. Lines starting with # are comments. Colors are #rrggbb.
# Unknown keys and invalid values are reported, nothing is changed in that case.

# ── Colors ──────────────────────────────────────────────────────────────────────

# The one accent: focused workspace, clock, cursor, borders, selection bars, progress bars.
# A gruvbox name (red orange yellow green aqua blue purple) or #rrggbb.
accent = red
# The accent as text color on dark backgrounds. Empty: the bright gruvbox variant,
# or a lighter shade of a #rrggbb accent.
accent_text =

bg      = #191c1c
surface = #252a2a
overlay = #313838
fg      = #ebdbb2
subtle  = #a89984
muted   = #7c6f64

# ── Scale ───────────────────────────────────────────────────────────────────────

# Size of everything (fonts, bar, menus, notifications, borders, cursor, lock screen, Firefox,
# GTK and Qt programs). All sizes in this file are at scale 1; the scale multiplies them.
# auto: the primary monitor sets it (its dpi / auto_dpi, steps of 0.25, 1 to 3), and every other
#   monitor is scaled so a window has the same physical size there. That needs a driver that
#   scales without tearing (TearFree: AMD with xf86-video-amdgpu); with any other the monitors
#   show the desktop 1:1. Super+Shift+p shows it and lines monitors up.
# Or a number from 0.5 to 4, e.g. 1.25: the same on every monitor, nothing scaled.
scale = auto
# Pixel density drawn at scale 1 with scale = auto: lower = everything larger, higher = smaller
# (175: a 14" 1080p laptop and a 27" 4K monitor get 1, a 13" 2560x1600 laptop 1.25, a 15.6" 4K
# laptop 1.5; at 125 they get 1.25, 1.25, 1.75 and 2.25)
auto_dpi = 175
# Firefox on top of that (1.1 = 10 % larger than the rest of the desktop)
firefox_scale = 1.00

# ── Fonts ───────────────────────────────────────────────────────────────────────

# Must be a Nerd Font: the icons everywhere are Nerd Font glyphs.
font = JetBrainsMono Nerd Font
font_size_terminal = 15
font_size_bar = 14
# rofi launcher and menus
font_size_menu = 13
# dunst notifications
font_size_notify = 10
# i3 window titles (tabbed and stacked containers)
font_size_window = 10

# ── Layout ──────────────────────────────────────────────────────────────────────

bar_height = 40
# frames of floating windows and notifications (px)
border_width = 2
# space between tiled windows (px)
gaps = 0
terminal_opacity = 0.90
terminal_padding_x = 14
terminal_padding_y = 10

# Mouse cursor, drawn in the palette with sharp corners (~/.icons/dotfiles):
# light (fg with a bg outline), dark (bg with an fg outline) or accent (accent with an fg outline)
cursor_style = light
# px at scale 1; programs pick a new size up on their next start, everything after logging in again
cursor_size = 32

# ── Bar ─────────────────────────────────────────────────────────────────────────

# Capsules to leave out, separated by spaces: music tray wlan ip vpn bluetooth volume
# backlight cpu memory temp battery. Without the hardware they hide themselves (no WiFi,
# Bluetooth adapter, backlight, battery, temperature sensor or sound card).
bar_hide =
# CPU temperature: auto (k10temp, zenpower, coretemp, cpu_thermal, ..., acpitz), none, or the
# name of a sensor: a hwmon driver (/sys/class/hwmon/*/name) or a thermal zone type
temperature_sensor = auto
# Screen brightness: auto (firmware, then platform, then raw interface), none, or a name in
# /sys/class/backlight
backlight = auto

# ── Input ───────────────────────────────────────────────────────────────────────

# Mice and touchpads (libinput, set at login and when a device is plugged in). auto = leave the
# setting alone (libinput's default, or what an Xorg config in /etc/X11/xorg.conf.d says).
# Mice: flat (no acceleration: the pointer moves as far as the mouse) or adaptive
mouse_acceleration = flat
# -1 (slow) to 1 (fast), 0 = the middle
mouse_speed = 0
# Touchpads: tap to click (yes, no), natural scrolling (yes, no: the content follows the
# fingers), acceleration (flat, adaptive) and speed (-1 to 1)
touchpad_tap = yes
touchpad_natural_scroll = auto
touchpad_acceleration = auto
touchpad_speed = auto
# X keyboard layout (setxkbmap), e.g. de, us, de(nodeadkeys), us,de; auto = leave the
# system's layout alone (the installer sets yours from the console keymap)
keyboard_layout = auto
# The key that sends XF86Display (often Fn+F7 or a monitor symbol): display (the display menu,
# Super+p), bluetooth (on/off, Super+b) or none
display_key = display

# ── Behaviour ───────────────────────────────────────────────────────────────────

# alacritty, kitty, wezterm, xterm, urxvt or st (only alacritty is themed by this file)
terminal = alacritty
# Image file; empty = the background color
wallpaper =
# auto = screenshots in your pictures folder (XDG_PICTURES_DIR, else ~/Pictures)
screenshot_dir = auto
# picom: auto (OpenGL, xrender when that fails, e.g. in a virtual machine), glx, egl, xrender
# or off (no transparency, no vsync)
compositor = auto
# Seconds of idle time: screensaver, then lock screen (0 = never lock when idle;
# suspend always locks), then display off (0 = never)
screensaver_after = 60
lock_after = 300
display_off_after = 300
