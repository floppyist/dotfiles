# tmux  ·  behaviour and keys
#
# Colors and the status line come from dotfiles.conf (templates/tmux.conf), sourced at
# the end. Reload after changes: prefix + r (or `dotfiles apply` for theme changes).
#
# Prefix: Ctrl+a
#   b / v      split below / right (in the current directory)
#   h j k l    select pane          H J K L   resize pane
#   c          new window (in the current directory)
#   [          copy mode (vi keys: v select, y copy to the clipboard)
#   r          reload this file

# tmux-256color knows italics and strikethrough; fall back where its terminfo is missing
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'
# 24-bit color in alacritty (and the usual suspects)
set -as terminal-features ",alacritty*:RGB,xterm-256color:RGB,xterm-kitty:RGB"

set -s escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S · #W"
setw -g mode-keys vi
set -g status-keys emacs

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind b split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 4
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 4

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Theme (generated by `dotfiles apply`); -q: no error before the first run
source-file -q ~/.config/dotfiles/tmux.conf
