# Mice: flat acceleration profile, speed 0 (no pointer acceleration).
# Same as: xinput set-prop <id> "libinput Accel Profile Enabled" 0 1 0
#          xinput set-prop <id> "libinput Accel Speed" 0
# Touchpads keep their own (adaptive) profile.
Section "InputClass"
    Identifier "dotfiles pointer"
    MatchIsPointer "on"
    MatchIsTouchpad "off"
    MatchDriver "libinput"
    Option "AccelProfile" "flat"
    Option "AccelSpeed" "0"
EndSection
