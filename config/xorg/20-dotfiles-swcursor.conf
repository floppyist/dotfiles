# dotfiles (install.sh, module graphics): draw the mouse pointer in software.
#
# With per-monitor scaling (dotfiles.conf: scale = auto) `displays` scales monitors down with
# xrandr --scale. The GPU scales the picture, but not the hardware pointer, so the pointer looked
# too large on those monitors. A software pointer is part of the picture and is scaled with it.
# Installed to /etc/X11/xorg.conf.d/; delete it (and log in again) to go back to the hardware pointer.

# amdgpu, radeon, modesetting (Intel and others), nouveau: option SWcursor
Section "OutputClass"
    Identifier  "dotfiles software cursor"
    MatchDriver "amdgpu|radeon|i915|xe|nouveau|virtio_gpu|vmwgfx|qxl|bochs-drm|simpledrm"
    Option      "SWcursor" "true"
EndSection

# NVIDIA's own driver: option HWCursor
Section "OutputClass"
    Identifier  "dotfiles software cursor (nvidia)"
    MatchDriver "nvidia-drm"
    Option      "HWCursor" "false"
EndSection
