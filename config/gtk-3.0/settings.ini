# GTK 3 settings (read at program start). Colors: gtk.css next to this file.
[Settings]
# Adwaita in its dark variant; gtk.css puts the desktop palette on top of it
gtk-theme-name=Adwaita
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Adwaita
gtk-font-name=Sans 10
# Drawn by `dotfiles apply` (~/.icons/dotfiles). No size here: GTK then uses Xcursor.size /
# XCURSOR_SIZE, which come from cursor_size in dotfiles.conf
gtk-cursor-theme-name=dotfiles
gtk-enable-event-sounds=1
gtk-enable-input-feedback-sounds=1
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintmedium
