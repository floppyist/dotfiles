# alacritty  ·  palette shared with i3, polybar, rofi, dunst
#
# Font, size, opacity, padding and all colors come from dotfiles.conf
# (templates/alacritty.toml). Keys set in this file win over the import, so do not
# repeat them here: edit dotfiles.conf and run `dotfiles apply`.

[general]
import = ["~/.config/dotfiles/alacritty.toml"]
live_config_reload = true

[window]
dynamic_padding = true
decorations = "None"

[cursor]
style = { shape = "Block", blinking = "Off" }
unfocused_hollow = true
