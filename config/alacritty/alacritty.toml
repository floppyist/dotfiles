# alacritty  ·  palette shared with i3, polybar, rofi, dunst

[general]
live_config_reload = true

[window]
opacity = 0.90
padding = { x = 14, y = 10 }
dynamic_padding = true
decorations = "None"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
size = 15

[cursor]
style = { shape = "Block", blinking = "Off" }
unfocused_hollow = true

[colors.primary]
background = "#191c1c"
foreground = "#ebdbb2"
dim_foreground = "#a89984"
bright_foreground = "#fbf1c7"

[colors.cursor]
text = "#191c1c"
cursor = "#cc241d"

[colors.vi_mode_cursor]
text = "#191c1c"
cursor = "#fabd2f"

[colors.selection]
text = "CellForeground"
background = "#313838"

[colors.search.matches]
foreground = "#191c1c"
background = "#d79921"

[colors.search.focused_match]
foreground = "#191c1c"
background = "#fb4934"

[colors.footer_bar]
foreground = "#ebdbb2"
background = "#252a2a"

[colors.normal]
black = "#2a3030"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"
