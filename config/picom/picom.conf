# picom (v12+ syntax: per-window behaviour lives in `rules`)

backend = "glx";
vsync = true;
use-damage = true;

shadow = false;
fading = false;
corner-radius = 0;

rules: (
    # Unfocused windows are slightly dimmed
    { match = "!focused"; opacity = 0.95; },

    # Bar, launcher/menus, notifications, the region screenshot overlay and the lock screen
    # are always opaque (later rules override earlier ones)
    { match = "window_type = 'dock' || class_g = 'Polybar' || class_g = 'Rofi' || class_g = 'Dunst' || class_g = 'Snip' || class_g = 'i3lock'"; opacity = 1; },
);
