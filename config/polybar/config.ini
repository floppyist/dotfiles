;  polybar  ·  status line
;
;  Layout: workspaces on the left, grouped "capsules" on the right
;          [music] tray [wifi ip vpn bluetooth] [volume brightness] [cpu ram temp] [battery] [clock]
;  Within a capsule, modules share the surface color; each capsule has its own gap module in
;  front (format-margin would take the capsule color, not the bar's).
;
;  Overflow: polybar cuts the right block off on the right (the clock first) when it does not
;  fit. polybar-fit (module "fit") measures both blocks and hides, in this order, until it fits:
;  cpu/memory/temp, volume/brightness, music. It also hides the gap in front of an empty capsule
;  (tray without icons), so there are no double gaps. Its tables mirror this file: after adding
;  or resizing modules, update FIXED/SLOTS/GROUPS in scripts/polybar-fit.
;
;  Colors (${colors.*}), fonts and the height come from dotfiles.conf (templates/polybar.ini).
;  Nerd Font icons are drawn wider than their one-cell advance: wide icons get two spaces.
;
;  Updates are event-driven wherever an event exists (no polling, no battery cost):
;    workspaces, volume       polybar internal (i3 IPC, pulseaudio events)
;    brightness               IPC hook from the brightness keys
;    music                    playerctl --follow (1/s while playing, nothing otherwise)
;    wifi, ip, vpn,           polybar-watch: nmcli monitor, ip monitor, gdbus monitor,
;    bluetooth, battery       udevadm monitor (+ a slow fallback refresh)
;    overflow (fit)           inotify on the module outputs, i3 IPC, X events of the tray
;    cpu, ram, temp, clock    sampled in-process by polybar (reading /proc, no programs started)

include-file = ~/.config/dotfiles/polybar.ini

[bar/main]
; launch.sh sets MONITOR to the primary output
monitor = ${env:MONITOR:}
width = 100%
height = ${dotfiles.height}
radius = 0
fixed-center = true
override-redirect = false
wm-restack = i3
enable-ipc = true
cursor-click = pointer

background = ${colors.bg}
foreground = ${colors.fg}

padding-left = 0
padding-right = 0
module-margin = 0

font-0 = ${dotfiles.font-0}
font-1 = ${dotfiles.font-1}

modules-left = i3
modules-right = fit music gap-tray tray gap-net wlan ip vpn bluetooth gap-audio pulseaudio backlight gap-sys cpu memory temp gap-bat battery gap-date date date-long

[module/gap]
type = custom/text
format = <label>
label = " "
format-background = ${colors.bg}

; one gap per capsule, so polybar-fit can hide the one in front of an empty capsule
[module/gap-tray]
inherit = module/gap
[module/gap-net]
inherit = module/gap
[module/gap-audio]
inherit = module/gap
[module/gap-sys]
inherit = module/gap
[module/gap-bat]
inherit = module/gap
[module/gap-date]
inherit = module/gap

; overflow manager: prints nothing (see the top of this file and scripts/polybar-fit)
[module/fit]
type = custom/script
exec = exec ~/.local/bin/polybar-fit
tail = true

; ── workspaces ──────────────────────────────────────────────────────────────

[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
enable-scroll = false
format = <label-state><label-mode>

label-focused = %name%
label-focused-background = ${colors.accent}
label-focused-foreground = ${colors.on-accent}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 2

; visible on another monitor
label-visible = %name%
label-visible-background = ${colors.overlay}
label-visible-foreground = ${colors.fg}
label-visible-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.orange}
label-urgent-foreground = ${colors.bg}
label-urgent-padding = 2

; binding mode (resize, ...)
label-mode = 󰩨 %mode%
label-mode-background = ${colors.yellow-hi}
label-mode-foreground = ${colors.bg}
label-mode-padding = 2

; ── music ───────────────────────────────────────────────────────────────────

[module/music]
type = custom/script
exec = exec ~/.local/bin/polybar-music.sh
tail = true
format = <label>
format-background = ${colors.surface}
format-padding = 1
label-font = 2
click-left = playerctl play-pause
click-right = playerctl next

[module/tray]
type = internal/tray
; same capsule as the other groups, so the app icons sit on a quiet surface
format = <tray>
format-background = ${colors.surface}
format-padding = 1
tray-background = ${colors.surface}
tray-size = 50%
tray-spacing = 10px

; ── net: wifi + ip + vpn + bluetooth ────────────────────────────────────────

[module/wlan]
type = custom/script
; refresh on every NetworkManager event, the signal strength every 30 s
exec = exec ~/.local/bin/polybar-watch --slot wlan 30 ~/.local/bin/polybar-wlan.sh --status -- nmcli monitor
tail = true
format-background = ${colors.surface}
format-padding = 1
click-left = ~/.local/bin/polybar-wlan.sh

[module/ip]
type = custom/script
; address of the active connection (WiFi or LAN); hidden while offline. Click: copy it
exec = exec ~/.local/bin/polybar-watch --slot ip 120 ~/.local/bin/polybar-ip.sh --status -- ip -o monitor address route
tail = true
format-background = ${colors.surface}
format-padding = 1
click-left = ~/.local/bin/polybar-ip.sh --copy

[module/vpn]
type = custom/script
; active VPN (green, yellow while connecting), a grey shield when profiles exist, else hidden.
; Click: menu (connect, import, FRITZ!Box, manage). Right click: toggle the last used profile
exec = exec ~/.local/bin/polybar-watch --slot vpn 60 ~/.local/bin/polybar-vpn.sh --status -- nmcli monitor
tail = true
format-background = ${colors.surface}
format-padding = 1
click-left = ~/.local/bin/vpn
click-right = ~/.local/bin/vpn toggle

[module/bluetooth]
type = custom/script
; refresh on bluez D-Bus signals (power, connect, disconnect)
exec = exec ~/.local/bin/polybar-watch --slot bluetooth 60 ~/.local/bin/polybar-bluetooth.sh --status -- gdbus monitor --system --dest org.bluez
tail = true
format-background = ${colors.surface}
format-padding = 1
click-left = ~/.local/bin/polybar-bluetooth.sh
click-right = ~/.local/bin/bluetooth-toggle.sh

; ── audio: volume + brightness ──────────────────────────────────────────────

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <ramp-volume><label-volume>
format-volume-background = ${colors.surface}
format-volume-padding = 1
label-volume = %percentage%%
ramp-volume-0 = "󰕿  "
ramp-volume-1 = "󰖀  "
ramp-volume-2 = "󰕾  "
ramp-volume-foreground = ${colors.blue-hi}
format-muted = <label-muted>
format-muted-background = ${colors.surface}
format-muted-padding = 1
label-muted = "󰝟  mute"
label-muted-foreground = ${colors.muted}
click-right = ~/.local/bin/terminal.sh --float pulsemixer

[module/backlight]
type = custom/ipc
hook-0 = ~/.local/bin/polybar-backlight.sh
initial = 1
format = <label>
format-prefix = "󰃠  "
format-prefix-foreground = ${colors.yellow-hi}
format-background = ${colors.surface}
format-padding = 1

; ── system: cpu + memory + temperature ──────────────────────────────────────

[module/cpu]
type = internal/cpu
interval = 2
warn-percentage = 85
format = <label>
format-prefix = "  "
format-prefix-foreground = ${colors.aqua-hi}
format-background = ${colors.surface}
format-padding = 1
label = %percentage%%
; under load: icon and value turn red
format-warn = <label-warn>
format-warn-prefix = "  "
format-warn-prefix-foreground = ${colors.red-hi}
format-warn-background = ${colors.surface}
format-warn-padding = 1
label-warn = %percentage%%
label-warn-foreground = ${colors.red-hi}

[module/memory]
type = internal/memory
interval = 5
warn-percentage = 90
format = <label>
format-prefix = "  "
format-prefix-foreground = ${colors.purple-hi}
format-background = ${colors.surface}
format-padding = 1
label = %percentage_used%%
format-warn = <label-warn>
format-warn-prefix = "  "
format-warn-prefix-foreground = ${colors.red-hi}
format-warn-background = ${colors.surface}
format-warn-padding = 1
label-warn = %percentage_used%%
label-warn-foreground = ${colors.red-hi}

[module/temp]
type = internal/temperature
interval = 5
thermal-zone = 0
warn-temperature = 80
format = <ramp><label>
format-background = ${colors.surface}
format-padding = 1
format-warn = <ramp><label-warn>
format-warn-background = ${colors.surface}
format-warn-padding = 1
label = %temperature-c%
label-warn = %temperature-c%
label-warn-foreground = ${colors.red-hi}
ramp-0 = "󱃃 "
ramp-1 = "󰔏 "
ramp-2 = "󱃂 "
ramp-foreground = ${colors.orange-hi}

; ── battery ─────────────────────────────────────────────────────────────────

[module/battery]
type = custom/script
; refresh on power_supply uevents (charger plugged in/out, capacity steps), at least every minute
exec = exec ~/.local/bin/polybar-watch --slot battery 60 ~/.local/bin/polybar-battery.sh --status -- udevadm monitor --udev --subsystem-match=power_supply
tail = true
; the script pads itself, so low battery can paint the whole capsule red
format-background = ${colors.surface}
format-padding = 0

; ── clock: red block, mirrors the focused workspace on the left ─────────────

[module/date]
type = internal/date
; checked every second so the minute flips on time; polybar redraws only when the text changes
interval = 1
time = %H:%M
; click: the full date (date-long). polybar-fit makes room for it before it switches
label = %{A1:~/.local/bin/polybar-fit --toggle-date:}%time%%{A}
format = <label>
format-background = ${colors.accent}
format-foreground = ${colors.on-accent}
format-padding = 2

[module/date-long]
inherit = module/date
hidden = true
date = "%a %d.%m.%Y  "
label = %{A1:~/.local/bin/polybar-fit --toggle-date:}%date%%time%%{A}
