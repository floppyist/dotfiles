;  polybar  ·  status line
;
;  Layout: workspaces on the left, grouped "capsules" on the right
;          [music] tray [net] [audio] [system] [battery] [clock]
;  Within a capsule, modules share the surface color; capsules are separated
;  by the "gap" module (format-margin would take the capsule color, not the bar's).

[colors]
bg        = #191c1c
surface   = #252a2a
overlay   = #313838
fg        = #ebdbb2
subtle    = #a89984
muted     = #7c6f64
red       = #cc241d
red-hi    = #fb4934
green-hi  = #b8bb26
yellow-hi = #fabd2f
blue-hi   = #83a598
purple-hi = #d3869b
aqua-hi   = #8ec07c
orange    = #d65d0e
orange-hi = #fe8019

[bar/main]
; launch.sh sets MONITOR to the primary output
monitor = ${env:MONITOR:}
width = 100%
height = 40
radius = 0
fixed-center = true
override-redirect = false
wm-restack = i3
enable-ipc = true
cursor-click = pointer

background = ${colors.bg}
foreground = ${colors.fg}

padding-left = 0
padding-right = 0
module-margin = 0

font-0 = "JetBrainsMono Nerd Font:size=14;4"
font-1 = "JetBrainsMono Nerd Font:size=11;3"

modules-left = i3
modules-right = music-info gap tray gap wlan bluetooth gap pulseaudio backlight gap cpu memory temp gap battery gap date

[module/gap]
type = custom/text
format = <label>
label = " "
format-background = ${colors.bg}

; ── workspaces ──────────────────────────────────────────────────────────────

[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
enable-scroll = false
format = <label-state><label-mode>

label-focused = %name%
label-focused-background = ${colors.red}
label-focused-foreground = ${colors.bg}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 2

; visible on another monitor
label-visible = %name%
label-visible-background = ${colors.overlay}
label-visible-foreground = ${colors.fg}
label-visible-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.orange}
label-urgent-foreground = ${colors.bg}
label-urgent-padding = 2

; binding mode (resize, ...)
label-mode = 󰩨 %mode%
label-mode-background = ${colors.yellow-hi}
label-mode-foreground = ${colors.bg}
label-mode-padding = 2

; ── music ───────────────────────────────────────────────────────────────────

[module/music-info]
type = custom/script
exec = ~/.config/polybar/scripts/audio_scroll.sh
interval = 2
format = <label>
format-background = ${colors.surface}
format-padding = 1
label-font = 2
click-left = playerctl play-pause
click-right = playerctl next

[module/tray]
type = internal/tray
; same capsule as the other groups, so the app icons sit on a quiet surface
format = <tray>
format-background = ${colors.surface}
format-padding = 1
tray-background = ${colors.surface}
tray-size = 50%
tray-spacing = 10px

; ── net: wifi + bluetooth ───────────────────────────────────────────────────

[module/wlan]
type = custom/script
exec = ~/.local/bin/polybar-wlan.sh --status
interval = 5
format-background = ${colors.surface}
format-padding = 1
click-left = ~/.local/bin/polybar-wlan.sh

[module/bluetooth]
type = custom/script
exec = ~/.local/bin/polybar-bluetooth.sh --status
interval = 5
format-background = ${colors.surface}
format-padding = 1
click-left = ~/.local/bin/polybar-bluetooth.sh
click-right = ~/.local/bin/bluetooth-toggle.sh

; ── audio: volume + brightness ──────────────────────────────────────────────

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <ramp-volume><label-volume>
format-volume-background = ${colors.surface}
format-volume-padding = 1
label-volume = %percentage%%
ramp-volume-0 = "󰕿 "
ramp-volume-1 = "󰖀 "
ramp-volume-2 = "󰕾 "
ramp-volume-foreground = ${colors.blue-hi}
format-muted = <label-muted>
format-muted-background = ${colors.surface}
format-muted-padding = 1
label-muted = 󰝟 mute
label-muted-foreground = ${colors.muted}
click-right = alacritty --class tool-float -e pulsemixer

[module/backlight]
type = custom/ipc
hook-0 = ~/.local/bin/polybar-backlight.sh
initial = 1
format = <label>
format-prefix = "󰃠 "
format-prefix-foreground = ${colors.yellow-hi}
format-background = ${colors.surface}
format-padding = 1

; ── system: cpu + memory + temperature ──────────────────────────────────────

[module/cpu]
type = internal/cpu
interval = 2
warn-percentage = 85
format = <label>
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.aqua-hi}
format-background = ${colors.surface}
format-padding = 1
label = %percentage%%
; under load: icon and value turn red
format-warn = <label-warn>
format-warn-prefix = "󰻠 "
format-warn-prefix-foreground = ${colors.red-hi}
format-warn-background = ${colors.surface}
format-warn-padding = 1
label-warn = %percentage%%
label-warn-foreground = ${colors.red-hi}

[module/memory]
type = internal/memory
interval = 5
warn-percentage = 90
format = <label>
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.purple-hi}
format-background = ${colors.surface}
format-padding = 1
label = %percentage_used%%
format-warn = <label-warn>
format-warn-prefix = "󰍛 "
format-warn-prefix-foreground = ${colors.red-hi}
format-warn-background = ${colors.surface}
format-warn-padding = 1
label-warn = %percentage_used%%
label-warn-foreground = ${colors.red-hi}

[module/temp]
type = internal/temperature
interval = 5
thermal-zone = 0
warn-temperature = 80
format = <ramp><label>
format-background = ${colors.surface}
format-padding = 1
format-warn = <ramp><label-warn>
format-warn-background = ${colors.surface}
format-warn-padding = 1
label = %temperature-c%
label-warn = %temperature-c%
label-warn-foreground = ${colors.red-hi}
ramp-0 = "󱃃 "
ramp-1 = "󰔏 "
ramp-2 = "󱃂 "
ramp-foreground = ${colors.orange-hi}

; ── battery ─────────────────────────────────────────────────────────────────

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 99
low-at = 15
poll-interval = 5

format-charging = <label-charging>
format-charging-prefix = "󰂄 "
format-charging-prefix-foreground = ${colors.green-hi}
format-charging-background = ${colors.surface}
format-charging-padding = 1
label-charging = %percentage%%

format-discharging = <ramp-capacity><label-discharging>
format-discharging-background = ${colors.surface}
format-discharging-padding = 1
label-discharging = %percentage%%
ramp-capacity-0 = "󰁺 "
ramp-capacity-1 = "󰁼 "
ramp-capacity-2 = "󰁾 "
ramp-capacity-3 = "󰂀 "
ramp-capacity-4 = "󰂂 "
ramp-capacity-5 = "󰁹 "
ramp-capacity-foreground = ${colors.yellow-hi}

format-full = <label-full>
format-full-prefix = "󰁹 "
format-full-prefix-foreground = ${colors.green-hi}
format-full-background = ${colors.surface}
format-full-padding = 1
label-full = full

format-low = <label-low>
format-low-prefix = "󰂃 "
format-low-background = ${colors.red}
format-low-foreground = ${colors.bg}
format-low-padding = 1
label-low = %percentage%%

; ── clock: red block, mirrors the focused workspace on the left ─────────────

[module/date]
type = internal/date
interval = 5
time = %H:%M
; click toggles the full date
date-alt = "%a %d.%m.%Y  "
time-alt = %H:%M
label = %date%%time%
format = <label>
format-background = ${colors.red}
format-foreground = ${colors.bg}
format-padding = 2
